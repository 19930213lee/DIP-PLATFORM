<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 数字图像处理教学平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f1535 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }
        .login-container {
            width: 420px;
            background: rgba(20, 25, 60, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 140, 255, 0.15);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }
        .login-header p {
            font-size: 13px;
            color: #7a8bb5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #8a9bc0;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid rgba(100, 140, 255, 0.2);
            border-radius: 8px;
            background: rgba(15, 20, 50, 0.6);
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #5a8aff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #3a6fff, #5a4fff);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.3s, transform 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .msg {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            min-height: 20px;
        }
        .msg.error {
            color: #ff6b6b;
        }
        .msg.success {
            color: #51cf66;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h1>数字图像处理教学平台</h1>
        <p>西南交通大学希望学院 · 人工智能学院</p>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>学号 / 工号</label>
            <input type="text" id="loginStudentId" placeholder="请输入学号或工号" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn-submit">登 录</button>
    </form>

    <div class="msg" id="message"></div>
</div>

<script>
    function showMsg(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = 'msg ' + type;
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = '登录中...';
        showMsg('', '');
        try {
            const resp = await fetch('/auth/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: document.getElementById('loginStudentId').value.trim(),
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await resp.json();
            if (data.status === 'success') {
                showMsg('登录成功，正在跳转...', 'success');
                setTimeout(() => { window.location.href = '/chapters'; }, 500);
            } else {
                showMsg(data.message, 'error');
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        } catch (err) {
            showMsg('网络错误，请稍后重试', 'error');
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    }
</script>

</body>
</html>
